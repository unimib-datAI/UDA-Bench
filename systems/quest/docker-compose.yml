services:
  vectordb:
    image: pgvector/pgvector:pg16
    container_name: quest_pgvector
    restart: unless-stopped
    environment:
      # DB_USER takes precedence over the legacy USER: on macOS/Linux the shell
      # exports USER (the login name) and Compose prefers it over --env-file.
      - POSTGRES_USER=${DB_USER:-${USER}}
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=${DATABASE}
    ports:
      - "${DB_PORT_EXTERNAL}:${DB_PORT_INTERNAL}"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-${USER}} -d ${DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data: